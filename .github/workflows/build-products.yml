name: Build products

on:
  workflow_dispatch:
    inputs:
      application:
        description: Product ID (pixelhub, kids, art, animals, relax) or all; validated from registry
        type: string
        default: pixelhub
      build_type:
        description: Android output
        type: choice
        default: preview-apk
        options: [preview-apk, release-apk, play-aab, release-all]
      source_ref:
        description: Optional branch, tag or commit SHA
        type: string
        required: false
  workflow_call:
    inputs:
      application:
        type: string
        default: pixelhub
      build_type:
        type: string
        default: preview-apk
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: products-${{ github.ref }}-${{ inputs.application }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          APPLICATION: ${{ inputs.application }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          python3 tool/products/cli.py validate
          case "$BUILD_TYPE" in preview-apk|release-apk|play-aab|release-all) ;; *) echo 'Invalid build type' >&2; exit 1;; esac
          echo "matrix=$(python3 tool/products/cli.py matrix --application "$APPLICATION")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: plan
    name: ${{ matrix.product }} / ${{ inputs.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.build_type == 'preview-apk' && 'preview' || matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 (Node.js 24)
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5 (Node.js 24)
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Validate configuration and generated registry
        run: |
          python3 tool/products/generate.py --check
          python3 tool/products/check_versions.py
      - name: Build and verify independent product
        env:
          PRODUCT_ID: ${{ matrix.product }}
          BUILD_TYPE: ${{ inputs.build_type }}
          PRODUCT_UPLOAD_KEYSTORE_BASE64: ${{ secrets[format('{0}_UPLOAD_KEYSTORE_BASE64', matrix.signing_prefix)] }}
          PRODUCT_UPLOAD_STORE_PASSWORD: ${{ secrets[format('{0}_UPLOAD_STORE_PASSWORD', matrix.signing_prefix)] }}
          PRODUCT_UPLOAD_KEY_ALIAS: ${{ secrets[format('{0}_UPLOAD_KEY_ALIAS', matrix.signing_prefix)] }}
          PRODUCT_UPLOAD_KEY_PASSWORD: ${{ secrets[format('{0}_UPLOAD_KEY_PASSWORD', matrix.signing_prefix)] }}
        run: python3 tool/products/build.py --product "$PRODUCT_ID" --type "$BUILD_TYPE" --output "artifacts/$PRODUCT_ID"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        with:
          name: ${{ matrix.product }}-${{ inputs.build_type }}-${{ needs.plan.outputs.sha }}
          path: artifacts/${{ matrix.product }}/
          if-no-files-found: error
          retention-days: 14
      - name: Report output
        env:
          PRODUCT_ID: ${{ matrix.product }}
        run: cat "artifacts/$PRODUCT_ID/manifest.json" >> "$GITHUB_STEP_SUMMARY"
