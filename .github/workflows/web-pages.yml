name: Publish verified Web artifact

on:
  workflow_run:
    workflows: ['Checks and Web artifacts']
    types: [completed]
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    # Never publish PR artifacts, even if a PR uses a branch named main.
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' &&
      startsWith(github.event.release.tag_name, 'pixelhub-content-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve last verified Web artifact
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="$SOURCE_RUN"
            sha="$SOURCE_SHA"
          else
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" \
              --jq '[.workflow_runs[] | select(.conclusion == "success") | [.id, .head_sha] | join(" ")] | first')
            test -n "$result" && test "$result" != "null"
            read -r run_id sha <<< "$result"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pixelhub-web-${{ steps.web.outputs.sha }}
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ steps.web.outputs.run_id }}
      - name: Verify artifact identity
        env:
          EXPECTED_SHA: ${{ steps.web.outputs.sha }}
        run: test "$(cat site/commit.txt)" = "$EXPECTED_SHA"
      - name: Seed one release-only sample picture
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-sample-v1 >/dev/null 2>&1; then
            python3 tool/online_release.py sample "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-sample-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" --title "PixelHub online pictures: sample 1" \
              --notes "First online-only example: Colorful balloon / بالن رنگی. Not part of git clone." \
              --latest=false
          fi
      - name: Publish six new online pictures outside git history
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-starter-6-v1 >/dev/null 2>&1; then
            python3 tool/online_starter_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-starter-6-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" --title "PixelHub online pictures: six new designs" \
              --notes "Six original offline-playable levels: Pink Tulip, Forest Mushroom, Cat Face, Watermelon Slice, Little Rocket, Purple Butterfly. All level JSON and PNG previews are Release assets and excluded from git clone." \
              --latest=false
          fi
      - name: Publish twelve additional pictures as a release-only asset
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-collection-12-v1 >/dev/null 2>&1; then
            python3 tool/online_collection_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-collection-12-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 12 fresh online coloring pictures" \
              --notes "Twelve original pixel-art coloring levels across animals, food, nature and space. Each numbered level and its PNG preview are downloadable release assets, not part of git clone." \
              --latest=false
          fi
      - name: Publish six classic masterwork interpretations outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-masterworks-6-v1 >/dev/null 2>&1; then
            python3 tool/online_masterworks_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-masterworks-6-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: six classic masterpieces in pixel art" \
              --notes "Six original simplified color-by-number interpretations: Mona Lisa, The Starry Night, The Scream, Sunflowers, Girl with a Pearl Earring and The Great Wave. Numbered JSON levels and PNG previews are downloadable Release assets, not tracked source files." \
              --latest=false
          fi
      - name: Publish detailed Starry Night replacement content only
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-starry-night-detailed-1-v1 >/dev/null 2>&1; then
            python3 tool/online_starry_night_replacement_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-starry-night-detailed-1-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" --title "PixelHub online content: detailed Starry Night" \
              --notes "Immutable replacement content only. Old version remains archived but is retired from the public catalog; no application release or version bump." \
              --latest=false
          fi
      - name: Publish ten new original animal pictures outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animals-10-v1 >/dev/null 2>&1; then
            python3 tool/online_animals_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animals-10-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 10 colorful animal coloring pictures" \
              --notes "Ten original animal pixel-art levels (lion, elephant, giraffe, penguin, dolphin, koala, flamingo, octopus, deer and parrot). Each bilingual color-by-number JSON and PNG preview is a downloadable Release asset, not bundled in APK or tracked in git." \
              --latest=false
          fi
      - name: Publish ten Iranian landmark pixel-art paintings outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-iran-landmarks-10-v1 >/dev/null 2>&1; then
            python3 tool/online_iran_landmarks_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-iran-landmarks-10-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: ten famous Iranian landmarks in pixel art" \
              --notes "Ten original color-by-number pixel-art interpretations of Iranian landmarks: Persepolis, Azadi Tower, Milad Tower, Imam Mosque, Si-o-se-pol, Nasir ol-Molk Mosque, Bam Citadel, Tomb of Hafez, Amir Chakhmaq and Golestan Palace. Release-only bilingual JSON levels and previews; not bundled in the app." \
              --latest=false
          fi
      - name: Publish ten high-detail landscape pictures outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-landscapes-10-v1 >/dev/null 2>&1; then
            python3 tool/online_landscapes_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-landscapes-10-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: ten detailed 64x64 landscape paintings" \
              --notes "Ten original nature color-by-number designs: Mountain Sunset, Alpine Lake and Forest, Forest Waterfall, Countryside Cottage, Golden Desert Dunes, Tropical Beach, Misty Forest, River and Stone Bridge, Moonlit Mountain Night, and Wildflower Valley. Bilingual JSON levels and PNG previews are Release assets, not shipped in the APK or tracked by Git." \
              --latest=false
          fi
      - name: Publish redesigned Azadi Tower v2 and ten Persian architectural abstractions
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-iran-z-architecture-11-v1 >/dev/null 2>&1; then
            python3 tool/online_iran_architecture_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-iran-z-architecture-11-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: redesigned Azadi Tower and ten Persian architectural patterns" \
              --notes "Original numbered pixel art: redesigned 80x80 Azadi Tower (existing ID, levelVersion 2) and ten new 64x64 abstract Persian architecture studies (muqarnas, dome, orsi glass, eslimi, arches, windcatcher, shamsa, mosque, brickwork and iwan). Bilingual schema-v2 levels, catalog and PNG previews live in Release assets, not Git or APK. Tag sorts after the immutable initial Iranian landmarks release for deterministic upgraded ID selection." \
              --latest=false
          fi
      - name: Publish twenty more distinct animal pictures outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animals-more-20-v1 >/dev/null 2>&1; then
            python3 tool/online_animals_more_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animals-more-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 20 new detailed animal coloring pictures" \
              --notes "Twenty original 48x48 numbered animal paintings: fox, wolf, brown bear, zebra, tiger, cheetah, kangaroo, hippopotamus, rhinoceros, crocodile, toucan, peacock, hedgehog, raccoon, sloth, seal, whale, shark, frog and chameleon. Bilingual schema-v2 level JSON, catalog and PNG previews are Release-only online assets, not bundled in Android or committed to Git." \
              --latest=false
          fi
      - name: Publish twenty more famous painting interpretations outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-masterworks-20-v1 >/dev/null 2>&1; then
            python3 tool/online_masterworks_20_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-masterworks-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: twenty more famous paintings as original pixel art" \
              --notes "Twenty new original 64x64 color-by-number homages to historic paintings: Birth of Venus, Creation of Adam, Last Supper, School of Athens, Night Watch, Milkmaid, Las Meninas, Third of May 1808, Liberty Leading the People, Wanderer above the Sea of Fog, Fighting Temeraire, Hay Wain, Impression Sunrise, Water Lilies, Moulin de la Galette, La Grande Jatte, The Kiss, Card Players, Wheatfield with Crows and Sleeping Gypsy. Bilingual JSON grids and PNG previews are Release assets, not bundled in Android or tracked in Git. None duplicate the six earlier masterworks." \
              --latest=false
          fi
      - name: Publish thirty original object pixel-art pictures outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-objects-30-v1 >/dev/null 2>&1; then
            python3 tool/online_objects_30_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-objects-30-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 30 original everyday object pixel-art levels" \
              --notes "Thirty original 48x48 color-by-number objects including camera, headphones, guitar, radio, bicycle, sailboat, microscope, robot, typewriter, globe and treasure chest. Bilingual level JSON and PNG previews are Release-only assets, not bundled into Android." \
              --latest=false
          fi
      - name: Publish twenty exact 10x10 object icons
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-objects-mini-20-v1 >/dev/null 2>&1; then
            python3 tool/online_objects_10_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-objects-mini-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 20 crisp 10x10 object icons" \
              --notes "Twenty original exact 10x10 color-by-number objects for the Objects category. Every level is authored as 100 discrete cells, with bilingual metadata and nearest-neighbor PNG previews. These immutable online Release assets are not bundled into the app or committed as generated files." \
              --latest=false
          fi
      - name: Publish twenty original playful coloring pictures outside git
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-playful-20-v1 >/dev/null 2>&1; then
            python3 tool/online_playful_20_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-playful-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: twenty playful pixel-art coloring pictures" \
              --notes "Twenty original 48x48 lighthearted coloring levels including smiling sun, rainbow cloud, heart, clover, friendly ghost, monster, UFO, magic wand, party hat, birthday cake, popcorn, bubble tea, rubber duck, teddy bear, yo-yo, kite, smiling moon, cute star, neon jellyfish and candy land. Numbered bilingual JSON grids and PNG previews are immutable Release-only assets; not bundled in Android or tracked in Git." \
              --latest=false
          fi
      - name: Publish twenty original Iranian heritage and cultural paintings
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-iranian-mix-20-v1 >/dev/null 2>&1; then
            python3 tool/online_iranian_mix_20_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-iranian-mix-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 20 original Iranian art and culture coloring pictures" \
              --notes "Twenty hand-authored 64x64 bilingual color-by-number levels covering Blue Mosque Tabriz, Khaju Bridge, Ali Qapu, Chehel Sotoun, Shah Cheragh, Fin and Eram gardens, Masuleh and Kandovan, Lut kaluts, Anzali lagoon, Damavand, Persian carpet, minakari, khatamkari, samovar, santur, tombak, Haft-Seen and Yalda. Immutable JSON levels, PNG previews and catalog are Release-only assets, not bundled into APK." \
              --latest=false
          fi
      - name: Publish 23 Iranian heritage, landscape and culture paintings
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-iranian-heritage-23-v1 >/dev/null 2>&1; then
            python3 tool/online_iranian_heritage_23_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-iranian-heritage-23-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 23 Iranian heritage and nature coloring pictures" \
              --notes "Twenty-three new bilingual 64x64 coloring levels: Pasargadae and Cyrus's Tomb, Chogha Zanbil, Saadi and Ferdowsi tombs, Soltaniyeh Dome, Karim Khan Citadel, Dowlatabad Garden, Borujerdi and Tabatabaei houses, Vank Cathedral, Falak-ol-Aflak Castle, Tabriz Bazaar, Yazd Jameh Mosque, Gonbad-e Qabus, Naqsh-e Rostam, Iranian landscape, traditional courtyard, Persian leopard, village daily life, Taq-e Bostan, Behistun, Shahr-e Sukhteh and Sheikh Lotfollah Mosque. Immutable level JSON and PNG previews are Release assets." \
              --latest=false
          fi
      - name: Publish animated sunflower as an optional online level
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animated-sunflower-1-v1 >/dev/null 2>&1; then
            python3 tool/online_animated_sunflower_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animated-sunflower-1-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: eight-frame dancing sunflower" \
              --notes "A new immutable online sunflower picture with eight downloadable frames." \
              --latest=false
          fi
      - name: Publish ten animated 8x8 abstract patterns
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-abstract-mini-10-v1 >/dev/null 2>&1; then
            python3 tool/online_abstract_8_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-abstract-mini-10-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: ten animated 8x8 abstract patterns" \
              --notes "Ten original exact 8x8 abstract patterns with bilingual metadata, crisp PNG previews, documented animation scenarios, and eight-frame loopable companions. Immutable online Release assets; not bundled in the app or committed as generated art." \
              --latest=false
          fi
      - name: Publish twenty animated 12x12 online mini pictures
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animated-mini-12-20-v1 >/dev/null 2>&1; then
            python3 tool/online_animated_12_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animated-mini-12-20-v1 "$RUNNER_TEMP/content.zip" --target "$TARGET_SHA" --title "PixelHub: 20 animated 12x12 mini pictures" --notes "Twenty unique 12x12 bilingual online pictures. Each includes an eight-frame, 180 ms downloadable animation sidecar, numbered level, and PNG preview. Assets live in an immutable Release outside the app bundle." --latest=false
          fi
      - name: Publish ten animated 64x64 classic paintings
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animated-masterworks-64-10-v1 >/dev/null 2>&1; then
            python3 tool/online_animated_masterworks_64_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animated-masterworks-64-10-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: ten original animated 64x64 classic paintings" \
              --notes "Ten distinct original 64x64 pixel-art interpretations of public-domain paintings, each with a downloadable checksum-bound eight-frame animation. Assets are an immutable Release outside Git and the APK." \
              --latest=false
          fi
      - name: Publish fifteen animated 64x64 classic paintings
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-animated-classics-64-15-v1 >/dev/null 2>&1; then
            python3 tool/online_animated_masterworks_64_15_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-animated-classics-64-15-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: fifteen animated 64x64 classic paintings" \
              --notes "15 distinct original pixel-art homages to public-domain classic paintings. Each 64x64 picture includes a checksum-bound eight-frame online animation companion and bilingual metadata. Assets are immutable Release files and are not bundled in the APK." \
              --latest=false
          fi
      - name: Publish twenty new 65x65 Iranian landmarks and cultural pictures
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-iran-more-65-20-v1 >/dev/null 2>&1; then
            python3 tool/online_iran_more_20_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-iran-more-65-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 20 new 65x65 Iranian coloring pictures" \
              --notes "Twenty original bilingual 65x65 pixel-art levels: Tabiat, Quran Gate, Veresk, Ahvaz White Bridge, Rudkhan, Alamut, Babak Castle, Shushtar watermills, Shazdeh Garden, Agha Bozorg, Isfahan Jameh Mosque, Yazd Fire Temple, Sa'd al-Saltaneh, Ali-Sadr Cave, Badab-e Surt, Chabahar Martian Mountains, boteh jegheh, Lalejin pottery, Persian tar and traditional Gulf lenj. Immutable Release-only JSON levels and PNG previews; no APK or app update required." \
              --latest=false
          fi
      - name: Publish twenty-five original 65x65 Persian rug coloring pictures
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-persian-rugs-65-25-v1 >/dev/null 2>&1; then
            python3 tool/online_persian_rugs_25_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-persian-rugs-65-25-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 25 Persian rug pixel-art patterns (65x65)" \
              --notes "Twenty-five distinct 65x65 bilingual Persian-rug-inspired online paintings, including Tabriz, Kashan, Isfahan, Nain, Qom, Heriz, Bijar, Senneh, Bakhtiari, Qashqai, Gabbeh, Turkmen, Baluch, Afshar, Kerman, Mashhad, Ardabil, Varamin, Sarouk, Hamedan, Shiraz, Yazd, Sistan, Mazandaran and Lori motifs. All generated JSON grids and lossless PNG previews are immutable release-only assets. Existing IDs, saved progress and APK contents are unchanged." \
              --latest=false
          fi
      - name: Publish twenty new 10x10 country flag pictures
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-country-flags-10-20-v1 >/dev/null 2>&1; then
            python3 tool/online_flags_20_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-country-flags-10-20-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: twenty 10x10 country flags" \
              --notes "Twenty original compact bilingual 10x10 pixel flag color-by-number levels, including Iran, France, Germany, Italy, Russia, Ukraine, Netherlands, Poland, Japan, Turkey, United States, United Kingdom, Canada, Brazil, India, China, Sweden, Norway, Finland and Switzerland. Each flag has a checksum-bound JSON grid and PNG preview. Published as immutable Release-only online content, not bundled into the APK." \
              --latest=false
          fi
      - name: Publish twenty-five 35x35 country flags as online-only pictures
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.web.outputs.sha }}
        run: |
          if ! gh release view pixelhub-content-country-flags-35-25-v1 >/dev/null 2>&1; then
            python3 tool/online_flags_35_25_pack.py "$RUNNER_TEMP/content.zip"
            gh release create pixelhub-content-country-flags-35-25-v1 "$RUNNER_TEMP/content.zip" \
              --target "$TARGET_SHA" \
              --title "PixelHub: 25 new 35x35 country flags" \
              --notes "Twenty-five entirely new bilingual 35x35 pixel-art country flags, complementing the first twenty 10x10 flags without duplicating any country: Spain, Portugal, Belgium, Austria, Denmark, Greece, Ireland, Czechia, Slovakia, Hungary, Romania, Bulgaria, Croatia, Serbia, South Korea, Australia, New Zealand, Mexico, Argentina, Chile, Colombia, Peru, South Africa, Egypt and Saudi Arabia. Each level includes a color-by-number JSON grid and a lossless PNG preview. Complex seals and lettering are simplified for small pixel art. Immutable Release-only content; app and prior downloads remain untouched." \
              --latest=false
          fi
      - name: Download release packs and assemble online catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/pixelhub-release-packs"
          while IFS= read -r tag; do
            test -n "$tag" || continue
            mkdir -p "$RUNNER_TEMP/pixelhub-release-packs/$tag"
            gh release download "$tag" --pattern content.zip \
              --dir "$RUNNER_TEMP/pixelhub-release-packs/$tag"
          done < <(gh release list --limit 300 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("pixelhub-content-"))) | .tagName')
          python3 tool/online_release.py assemble \
            "$RUNNER_TEMP/pixelhub-release-packs" site/online
      - name: Generate checksum-bound recipes for new Iranian heritage animations
        run: python3 tool/online_iranian_heritage_23_pack.py recipes site/online tool/animation_batches
      - name: Add checksum-bound animation companions to existing pictures
        run: python3 tool/publish_animation_companions.py site/online
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
