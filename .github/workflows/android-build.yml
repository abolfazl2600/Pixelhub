name: "Build Android (preview APK or signed store APK + Play AAB)"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, SHA or tag
        required: false
        type: string
      build_kind:
        description: PixelHub preview or signed store outputs
        required: true
        default: play-aab
        type: choice
        options: [preview-apk, play-aab]
permissions:
  contents: read
jobs:
  android:
    uses: ./.github/workflows/build-products.yml
    with:
      application: pixelhub
      build_type: ${{ inputs.build_kind == 'play-aab' && 'release-all' || 'preview-apk' }}
      source_ref: ${{ inputs.ref || github.ref }}
    secrets: inherit
