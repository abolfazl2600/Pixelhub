name: Build Android APK (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional commit SHA or tag; leave empty to build the selected branch'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Record actual source identity
        id: source
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^version: ([0-9]+\.[0-9]+\.[0-9]+)', Path('apps/game/pubspec.yaml').read_text(), re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: bash tool/validate.sh
      - run: flutter build apk --release --no-pub
        working-directory: apps/game
      - name: Record artifact commit
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > apps/game/build/app/outputs/flutter-apk/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixelhub-apk-v${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}
          path: |
            apps/game/build/app/outputs/flutter-apk/app-release.apk
            apps/game/build/app/outputs/flutter-apk/commit.txt
          if-no-files-found: error
          retention-days: 14
