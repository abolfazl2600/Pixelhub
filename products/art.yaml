{
  "schema_version": 1,
  "id": "art",
  "ready": true,
  "identity": {
    "name": "PixelHub Art",
    "display_name_fa": "پیکسل‌هاب هنر",
    "application_id": "io.github.abolfazl2600.pixelhub.art",
    "storage_scope": "pixelhub_art",
    "version_name": "1.0.0",
    "version_code": 1,
    "icon": "apps/game/assets/brand/art_mark.png",
    "publisher": "abolfazl2600"
  },
  "appearance": {
    "primary": "#825735",
    "secondary": "#F2B957",
    "background": "#FFF9EF",
    "theme_mode": "light",
    "font_family": "Vazirmatn",
    "home_layout": "art",
