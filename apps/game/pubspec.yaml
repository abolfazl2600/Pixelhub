name: pixelhub
description: Pixelhub V1 technical preview for Android and Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  cupertino_icons: 1.0.8
  go_router: 16.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_system:
    path: ../../packages/design_system
  game_domain:
    path: ../../packages/game_domain
  level_schema:
    path: ../../packages/level_schema
  persistence:
    path: ../../packages/persistence

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/levels/sunflower.json
  fonts:
    # Flutter Web's engine default is also local, avoiding its remote fallback.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
