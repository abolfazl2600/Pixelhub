name: pixelhub
description: Pixelhub bilingual pixel coloring game for Android and Web.
publish_to: none
version: 0.4.0+7

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.7'

dependencies:
  cupertino_icons: 1.0.8
  go_router: 16.2.4
  web: 1.1.1
  file_selector: 1.0.4
  image: 4.5.4
  http: 1.6.0
  crypto: 3.0.6
  share_plus: 11.1.0
  painting_engine:
    path: ../../packages/painting_engine
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  design_system:
    path: ../../packages/design_system
  game_domain:
    path: ../../packages/game_domain
  level_schema:
    path: ../../packages/level_schema
  persistence:
    path: ../../packages/persistence

  intl: 0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/levels/
    - assets/animations/
    - assets/sounds/
    - assets/brand/pixelhub_mark.png
  fonts:
    # Flutter Web's engine default is also local, avoiding its remote fallback.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn.ttf
