<!DOCTYPE html>
<html lang="fa">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#069AEA">
  <meta name="description" content="پیکسل‌هاب؛ پیش‌نمایش بازی رنگ‌آمیزی پیکسلی برای Android و وب.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PixelHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>PixelHub</title>
  <style>
    html, body { margin: 0; background: #e9e9e1; }
    #bootstrap-status { box-sizing: border-box; min-height: 100dvh; max-width: 430px; margin: auto; display: grid; place-content: center; padding: 24px; text-align: center; background: #f9f7f1; color: #223a31; font-family: sans-serif; }
    #bootstrap-status strong { font-size: 28px; }
    #bootstrap-status button { min-height: 48px; padding: 12px 24px; border: none; border-radius: 12px; background: #316349; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="bootstrap-status" dir="rtl" role="status" aria-live="polite">
    <strong>PixelHub</strong>
    <p>در حال آماده‌سازی پیکسل‌ها…</p>
  </div>
  <noscript>برای اجرای پیکسل‌هاب JavaScript را فعال کنید.</noscript>
  <script src="flutter_bootstrap.js" async></script>

</html>
